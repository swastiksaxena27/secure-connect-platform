<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Connect Chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { margin-bottom: 1rem; }
    input, button { padding: 0.5rem; margin: 0.25rem 0; }
    #messages { border: 1px solid #ccc; height: 280px; overflow-y: auto; padding: 0.5rem; margin-bottom: 0.5rem; }
    .system { color: #777; font-style: italic; }
    .error { color: #b00020; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Secure Connect Chat</h1>

  <fieldset id="loginBox">
    <legend>1. Log in</legend>
    <input id="email" type="email" placeholder="email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Log in</button>
  </fieldset>

  <fieldset id="chatBox" class="hidden">
    <legend>2. Chat</legend>
    <p id="status"></p>
    <input id="room" value="general">
    <button id="joinBtn">Join room</button>
    <div id="messages"></div>
    <input id="text" placeholder="Type a message" maxlength="500">
    <button id="sendBtn">Send</button>
  </fieldset>

  <p id="error" class="error"></p>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let socket = null;
    let currentRoom = null;

    function addLine(text, className = '') {
      const div = document.createElement('div');
      div.className = className;
      div.textContent = text; // textContent (not innerHTML) prevents script injection
      $('messages').appendChild(div);
      $('messages').scrollTop = $('messages').scrollHeight;
    }

    async function login() {
      $('error').textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('email').value, password: $('password').value }),
        });
        const data = await res.json();
        if (!res.ok) {
          $('error').textContent = data.message;
          return;
        }
        connect(data.token);
      } catch {
        $('error').textContent = 'Could not reach the server';
      }
    }

    function connect(token) {
      socket = io({ auth: { token } }); // the server checks this token before allowing the connection

      socket.on('connect', () => {
        $('loginBox').classList.add('hidden');
        $('chatBox').classList.remove('hidden');
        $('status').textContent = 'Connected as ' + $('email').value;
        joinRoom();
      });
      socket.on('connect_error', (err) => {
        $('error').textContent = 'Connection failed: ' + err.message;
      });
      socket.on('message', ({ room, username, text }) => addLine(`[${room}] ${username}: ${text}`));
      socket.on('system', ({ text }) => addLine(text, 'system'));
      socket.on('disconnect', () => { $('status').textContent = 'Disconnected'; });
    }

    function joinRoom() {
      const room = $('room').value.trim();
      if (currentRoom && currentRoom !== room) socket.emit('leaveRoom', currentRoom);
      socket.emit('joinRoom', room, (res) => {
        if (!res.ok) {
          $('error').textContent = res.error;
          return;
        }
        $('error').textContent = '';
        currentRoom = res.room;
        addLine(`You joined room ${res.room}`, 'system');
      });
    }

    function sendMessage() {
      const text = $('text').value.trim();
      if (!text || !currentRoom) return;
      socket.emit('chatMessage', { room: currentRoom, text }, (res) => {
        if (!res.ok) $('error').textContent = res.error;
      });
      $('text').value = '';
    }

    $('loginBtn').addEventListener('click', login);
    $('joinBtn').addEventListener('click', joinRoom);
    $('sendBtn').addEventListener('click', sendMessage);
    $('text').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
